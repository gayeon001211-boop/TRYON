[project]
name = "tryon-helper"
version = "0.1.0"
description = "Local helper for TRYON: precise segmentation and Blender modelling, on this machine only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11",
    "numpy>=2",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false
